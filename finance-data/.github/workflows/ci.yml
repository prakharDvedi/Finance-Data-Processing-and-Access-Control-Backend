name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_data"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_data
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 1h
      TEST_BASE_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: finance-data/package-lock.json

      - name: Install dependencies
        working-directory: finance-data
        run: npm ci

      - name: Prisma generate
        working-directory: finance-data
        run: npx prisma generate

      - name: Run migrations
        working-directory: finance-data
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: finance-data
        run: npx prisma db seed

      - name: Start API server
        working-directory: finance-data
        run: npm run dev &
      
      - name: Wait for API
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$code" != "000" ]; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          exit 1

      - name: Run tests
        working-directory: finance-data
        run: npm test
